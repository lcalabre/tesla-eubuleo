<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Il telefono diventa un tachimetro da 0 a 200 km/h, con la modalita specchiata per leggerlo riflesso sul parabrezza. Nessuna app, nessun account, funziona su qualsiasi auto.">
<meta name="theme-color" content="#06080A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="canonical" href="https://lcalabre.github.io/tesla-eubuleo/tachimetro.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icona-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Tachimetro GPS">
<meta property="og:description" content="Il telefono diventa un tachimetro da 0 a 200 km/h, con la modalita specchiata per leggerlo riflesso sul parabrezza. Nessuna app, nessun account, funziona su qualsiasi auto.">
<meta property="og:image" content="https://lcalabre.github.io/tesla-eubuleo/anteprima.png">
<meta property="og:url" content="https://lcalabre.github.io/tesla-eubuleo/tachimetro.html">
<meta property="og:locale" content="it_IT">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tachimetro GPS">
<meta name="twitter:description" content="Il telefono diventa un tachimetro da 0 a 200 km/h, con la modalita specchiata per leggerlo riflesso sul parabrezza. Nessuna app, nessun account, funziona su qualsiasi auto.">
<meta name="twitter:image" content="https://lcalabre.github.io/tesla-eubuleo/anteprima.png">
<title>Tachimetro GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&display=swap">
<style>
  /* Strumento da abitacolo: un solo tema, scuro, con la palette scura della dashboard Energy Lab.
     Il colore della fascia di velocita' tinge lo sfondo; in modalita' specchiata lo sfondo resta
     nero, perche' sul parabrezza un fondo colorato si riflette e abbaglia. */
  :root{
    --fondo:#0b0b0a; --ink:#fff; --ink2:#c3c2b7; --muto:#8f8e86;
    --vetro:rgba(255,255,255,.045); --filo:rgba(255,255,255,.09);
    --tinta:rgb(143,142,134); --alone:rgba(0,0,0,0); --velo:rgba(0,0,0,0);
    color-scheme: dark;
  }
  html, body{height:100%;}
  body{
    margin:0; background:var(--fondo); color:var(--ink);
    font-family:Manrope, system-ui, sans-serif; font-weight:400;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .aura{position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(34% 52% at 33% 52%, var(--alone), transparent 70%),
      linear-gradient(var(--velo), var(--velo));
    transition:opacity .6s ease;}
  .aura::after{content:""; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);}
  .specchio .aura{opacity:0;}

  .schermo{
    position:relative; z-index:1;
    height:100%; box-sizing:border-box; display:flex; gap:14px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    flex-direction:column;
  }
  .specchio .riflesso{transform:scaleX(-1);}

  .testa{display:flex; justify-content:space-between; align-items:center; gap:10px;
         font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
         color:var(--muto); flex:none;}
  .stato{display:inline-flex; align-items:center; gap:8px;}
  .spia{width:8px; height:8px; border-radius:50%; background:var(--muto); flex:none;}
  .spia.viva{background:#22d37a; box-shadow:0 0 12px #22d37a;}
  .spia.scarsa{background:#facc15; box-shadow:0 0 12px #facc15;}
  .spia.demo{background:#38bdf8; box-shadow:0 0 12px #38bdf8;}

  .corpo{flex:1; display:flex; gap:18px; min-height:0; align-items:stretch;}
  .quadrante{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;}
  .quadrante svg{width:100%; height:100%; max-height:100%; overflow:visible;}

  .fianco{flex:none; width:200px; display:flex; flex-direction:column; gap:10px; justify-content:center;}
  .cella{background:var(--vetro); border:1px solid var(--filo); border-radius:18px;
         -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
         padding:11px 16px; display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .cella .v{font-weight:300; font-size:26px; letter-spacing:-.02em;
            font-variant-numeric:tabular-nums; line-height:1.1;}
  .cella .e{font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muto);}
  .comandi{display:flex; gap:8px; margin-top:4px;}
  button{
    flex:1; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink);
    background:var(--vetro); border:1px solid var(--filo); border-radius:999px;
    padding:12px 8px; cursor:pointer; min-height:46px;
    transition:background .2s, border-color .3s, color .3s;
  }
  button:active{background:rgba(255,255,255,.1);}
  button.primario{background:var(--ink); color:#0b0b0a; border-color:var(--ink);}
  button.primario.acceso{background:transparent; color:var(--ink); border-color:var(--tinta);}
  button.acceso{border-color:var(--tinta);}
  button:focus-visible{outline:2px solid var(--tinta); outline-offset:2px;}

  .messaggio{
    flex:none; font-size:13px; line-height:1.5; color:var(--ink2); text-align:center;
    background:var(--vetro); border:1px solid var(--filo); border-radius:14px; padding:10px 14px;
  }
  .messaggio b{color:var(--ink); font-weight:600;}
  .messaggio a{color:var(--ink);}
  .messaggio:empty{display:none;}

  #arco-vivo, #punta, #zona{transition:stroke .3s, fill .3s;}

  /* In verticale il quadrante sta sopra e i numeri sotto: in orizzontale affiancati. */
  @media (orientation: portrait){
    .corpo{flex-direction:column;}
    .fianco{width:auto;}
    .cella{justify-content:center; gap:10px;}
    .aura{background:radial-gradient(60% 26% at 50% 34%, var(--alone), transparent 70%),
                     linear-gradient(var(--velo), var(--velo));}
  }
  @media (orientation: landscape) and (max-height:520px){
    .testa{font-size:10px;}
    .fianco{width:min(34vw, 230px); gap:8px;}
    .cella{padding:8px 14px;}
    .cella .v{font-size:22px;}
  }
  @media (prefers-reduced-motion: reduce){
    .aura, button, #arco-vivo, #punta, #zona{transition:none;}
  }
</style>

</head>
<body>
<div class="aura" id="aura"></div>
<div class="schermo" id="schermo">
  <div class="testa riflesso">
    <span class="stato"><i class="spia" id="spia"></i><span id="etichetta-gps">GPS spento</span></span>
    <span id="schermo-acceso"></span>
  </div>

  <div class="corpo">
    <div class="quadrante riflesso">
      <svg id="strumento" viewBox="36 30 348 278" role="img"
           aria-label="Quadrante della velocita da 0 a 200 chilometri orari"></svg>
    </div>
    <div class="fianco riflesso">
      <div class="cella"><span class="v" id="distanza">0,0</span><span class="e">km</span></div>
      <div class="cella"><span class="v" id="media">0</span><span class="e">media</span></div>
      <div class="cella"><span class="v" id="massima">0</span><span class="e">massima</span></div>
      <div class="comandi">
        <button id="avvia" class="primario">Avvia</button>
        <button id="specchia">Specchia</button>
        <button id="azzera">Azzera</button>
      </div>
    </div>
  </div>

  <div class="messaggio riflesso" id="messaggio">
    Tocca <b>Avvia</b> e concedi la posizione. La velocit&agrave; arriva dal GPS del dispositivo,
    non dall&rsquo;auto.
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const nf = (n, d = 0) => n.toLocaleString("it-IT", {minimumFractionDigits: d, maximumFractionDigits: d});

const FONDO = 200;            // fondoscala: la Model 3 arriva a circa 201 km/h
const A0 = -216, A1 = 36;     // angoli di inizio e fine dell'arco, in gradi
const DEMO = new URLSearchParams(location.search).has("demo");

/* Le fasce: il colore tinge arco e sfondo, il nome compare sotto la cifra. */
const FASCE = [
  {fino: 50,  rgb: [56, 189, 248], nome: "Città"},
  {fino: 90,  rgb: [34, 211, 122], nome: "Extraurbana"},
  {fino: 110, rgb: [250, 204, 21], nome: "Superstrada"},
  {fino: 130, rgb: [251, 146, 60], nome: "Autostrada"},
  {fino: 160, rgb: [249, 99, 22],  nome: "Oltre 130"},
  {fino: 190, rgb: [239, 45, 58],  nome: "Oltre 160"},
  {fino: 999, rgb: [217, 19, 93],  nome: "Oltre 190"},
];
const SFUMA = 3;              // km/h per lato in cui due colori si mescolano: niente lampeggi al confine

function indiceFascia(v) { let i = 0; while (v >= FASCE[i].fino) i++; return i; }

function colore(v) {
  const i = indiceFascia(v), c = FASCE[i].rgb;
  const su = FASCE[i].fino, giu = i ? FASCE[i - 1].fino : -99;
  if (i < FASCE.length - 1 && v > su - SFUMA) return mescola(c, FASCE[i + 1].rgb, (v - (su - SFUMA)) / (2 * SFUMA));
  if (i > 0 && v < giu + SFUMA) return mescola(FASCE[i - 1].rgb, c, (v - (giu - SFUMA)) / (2 * SFUMA));
  return c;
}
const mescola = (a, b, t) => a.map((x, k) => Math.round(x + (b[k] - x) * t));

let osservatore = null, blocco = null, precedente = null;
let metri = 0, secondiInMoto = 0, massima = 0, attivo = false;

/* ---------- quadrante ---------- */
const CX = 210, CY = 208, R = 148;
const ang = v => A0 + (A1 - A0) * Math.min(1, Math.max(0, v / FONDO));
const punto = (a, r) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];

function arco(da, a, raggio) {
  const [x1, y1] = punto(ang(da), raggio), [x2, y2] = punto(ang(a), raggio);
  const largo = Math.abs(ang(a) - ang(da)) > 180 ? 1 : 0;
  return "M" + x1 + " " + y1 + " A" + raggio + " " + raggio + " 0 " + largo + " 1 " + x2 + " " + y2;
}

function disegnaQuadrante() {
  let s = '<defs><filter id="bagliore" filterUnits="userSpaceOnUse" x="0" y="0" width="420" height="340">' +
          '<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/>' +
          '<feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  // anello esterno: lo spettro delle fasce, quella attiva si accende
  let da = 0;
  FASCE.forEach((f, i) => {
    const a = Math.min(f.fino, FONDO);
    s += '<path class="spettro" data-i="' + i + '" d="' + arco(da + .8, a - .8, R + 17) +
         '" fill="none" stroke="rgb(' + f.rgb + ')" stroke-width="3" stroke-linecap="round" stroke-opacity=".28"/>';
    da = a;
  });
  s += '<path d="' + arco(0, FONDO, R) + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14" stroke-linecap="round"/>';
  s += '<path id="arco-vivo" d="" fill="none" stroke="var(--tinta)" stroke-width="14" stroke-linecap="round" filter="url(#bagliore)"/>';
  for (let v = 0; v <= FONDO; v += 10) {
    const grande = v % 20 === 0;
    const a = ang(v);
    const [x1, y1] = punto(a, R - 14), [x2, y2] = punto(a, R - (grande ? 25 : 20));
    s += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="#fff" stroke-width="' + (grande ? 2 : 1.2) + '" stroke-opacity="' + (grande ? .55 : .22) +
         '" stroke-linecap="round"/>';
    if (grande) {
      const [tx, ty] = punto(a, R - 41);
      s += '<text x="' + tx + '" y="' + (ty + 4.5) + '" text-anchor="middle" font-size="13" ' +
           'font-family="Manrope, sans-serif" font-weight="500" fill="#8f8e86">' + v + "</text>";
    }
  }
  s += '<circle id="punta" cx="0" cy="0" r="6.5" fill="#fff" stroke="var(--tinta)" stroke-width="3" ' +
       'filter="url(#bagliore)" opacity="0"/>';
  s += '<text id="cifra" x="' + CX + '" y="' + (CY + 2) + '" text-anchor="middle" font-size="80" ' +
       'font-family="Manrope, sans-serif" font-weight="200" letter-spacing="-2" fill="#8f8e86" ' +
       'style="font-variant-numeric:tabular-nums">--</text>';
  s += '<text x="' + CX + '" y="' + (CY + 26) + '" text-anchor="middle" font-size="12" ' +
       'font-family="Manrope, sans-serif" font-weight="600" fill="#8f8e86" letter-spacing="4">KM/H</text>';
  s += '<text id="zona" x="' + CX + '" y="' + (CY + 56) + '" text-anchor="middle" font-size="13" ' +
       'font-family="Manrope, sans-serif" font-weight="700" fill="var(--tinta)" letter-spacing="3"></text>';
  $("strumento").innerHTML = s;
}
disegnaQuadrante();

let mostrata = 0, ultimaTinta = "", fasciaMostrata = -1;
function tingi(v, acceso) {
  const c = acceso ? colore(v) : [143, 142, 134];
  const chiave = c.join(",") + acceso;
  if (chiave === ultimaTinta) return;
  ultimaTinta = chiave;
  const st = document.documentElement.style;
  st.setProperty("--tinta", "rgb(" + c + ")");
  st.setProperty("--alone", acceso ? "rgba(" + c + ",.2)" : "rgba(0,0,0,0)");
  st.setProperty("--velo", acceso ? "rgba(" + c + ",.04)" : "rgba(0,0,0,0)");
}

function muoviA(kmh, agganciato) {
  const v = Math.min(FONDO, Math.max(0, kmh));
  mostrata += (v - mostrata) * 0.35;                 // l'arco non salta, si avvicina
  const a = $("arco-vivo"), c = $("cifra"), p = $("punta"), z = $("zona");
  if (a) a.setAttribute("d", mostrata > 1 ? arco(0, mostrata, R) : "");
  if (p) {
    const [x, y] = punto(ang(mostrata), R);
    p.setAttribute("cx", x); p.setAttribute("cy", y);
    p.setAttribute("opacity", agganciato ? 1 : 0);
  }
  tingi(mostrata, agganciato);
  if (c) {
    c.textContent = agganciato ? nf(v) : "--";
    c.setAttribute("fill", agganciato ? "#fff" : "#8f8e86");
  }
  // il nome della fascia cambia solo 2 km/h oltre il confine, cosi' non balla
  let i = agganciato ? indiceFascia(mostrata) : -1;
  if (i >= 0 && fasciaMostrata >= 0 && i !== fasciaMostrata) {
    const confine = i > fasciaMostrata ? FASCE[fasciaMostrata].fino : FASCE[i].fino;
    if (Math.abs(mostrata - confine) < 2) i = fasciaMostrata;
  }
  if (i !== fasciaMostrata) {
    fasciaMostrata = i;
    if (z) z.textContent = i >= 0 ? FASCE[i].nome.toUpperCase() : "";
    document.querySelectorAll(".spettro").forEach(el =>
      el.setAttribute("stroke-opacity", +el.dataset.i === i ? 1 : .28));
  }
}
setInterval(() => muoviA(obiettivo, agganciatoOra), 60);
let obiettivo = 0, agganciatoOra = false;

/* ---------- posizione ---------- */
const RT = 6371000;
function distanza(a, b) {
  const f1 = a.lat * Math.PI / 180, f2 = b.lat * Math.PI / 180;
  const df = (b.lat - a.lat) * Math.PI / 180, dl = (b.lon - a.lon) * Math.PI / 180;
  const h = Math.sin(df / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) ** 2;
  return 2 * RT * Math.asin(Math.sqrt(h));
}

function aggiorna(pos) {
  const c = pos.coords, ora = pos.timestamp / 1000;
  const p = {lat: c.latitude, lon: c.longitude, t: ora};
  // coords.speed viene dal doppler ed e' il dato buono; se manca, si ricava da due fix
  let kmh = (c.speed !== null && c.speed !== undefined && !Number.isNaN(c.speed)) ? c.speed * 3.6 : null;
  if (precedente) {
    const dt = ora - precedente.t, passo = distanza(precedente, p);
    if (kmh === null && dt > 0.4 && dt < 30) kmh = passo / dt * 3.6;
    // sotto i 2 km/h il GPS "cammina" da fermo: quei metri non sono strada
    if (dt > 0 && dt < 30 && kmh !== null && kmh >= 2 && c.accuracy <= 30) {
      metri += passo;
      secondiInMoto += dt;
    }
  }
  precedente = p;
  if (kmh === null) kmh = 0;
  if (kmh > massima) massima = kmh;
  obiettivo = kmh;
  agganciatoOra = true;

  $("distanza").textContent = nf(metri / 1000, 1);
  $("media").textContent = nf(secondiInMoto > 5 ? metri / secondiInMoto * 3.6 : 0);
  $("massima").textContent = nf(massima);
  const buono = c.accuracy <= 20;
  $("spia").className = "spia " + (buono ? "viva" : "scarsa");
  $("etichetta-gps").textContent = "GPS " + (buono ? "agganciato" : "debole") + " - " + nf(c.accuracy) + " m";
  if (buono) $("messaggio").innerHTML = "";
}

function errore(e) {
  // Solo il permesso negato e' definitivo: "posizione non disponibile" e timeout capitano
  // in galleria e nei box, e li' si aspetta invece di spegnere tutto.
  if (e.code === 1) { spiegaIlRifiuto(); fermaTutto(); return; }
  $("spia").className = "spia scarsa";
  $("etichetta-gps").textContent = "segnale perso";
  $("messaggio").innerHTML = "Segnale perso, continuo a cercarlo. Succede in galleria e nei garage.";
}

/* Il permesso puo' mancare per due motivi diversi, e il rimedio e' diverso: o l'hai negato
   tu al sito, oppure la pagina sta girando dentro una cornice che non lo lascia passare. */
async function spiegaIlRifiuto() {
  let stato = "?";
  try { stato = (await navigator.permissions.query({name: "geolocation"})).state; } catch (e) {}
  const incorniciata = window.self !== window.top;
  const m = $("messaggio");
  if (stato === "denied") {
    m.innerHTML = "<b>Permesso negato nelle impostazioni del sito.</b> Su Chrome: i tre puntini, " +
      "Impostazioni, Impostazioni sito, Posizione, cerca questo sito e metti Consenti. " +
      "Poi ricarica la pagina.";
  } else if (incorniciata) {
    m.innerHTML = "<b>La pagina gira dentro una cornice che blocca il GPS</b> (stato del permesso: " +
      stato + "). Non dipende dalle tue impostazioni: va aperta come pagina sua, " +
      "sul dominio tuo. Vedi GUIDA.md, passo 0.";
  } else {
    m.innerHTML = "Permesso non concesso (stato: " + stato + "). Riprova e scegli Consenti, " +
      "oppure controlla che la posizione del dispositivo sia accesa.";
  }
}

async function tieniAccesoLoSchermo() {
  try {
    blocco = await navigator.wakeLock.request("screen");
    $("schermo-acceso").textContent = "schermo bloccato";
    blocco.addEventListener("release", () => $("schermo-acceso").textContent = "");
  } catch (e) { $("schermo-acceso").textContent = ""; }
}

function fermaTutto() {
  if (osservatore !== null) navigator.geolocation.clearWatch(osservatore);
  osservatore = null; attivo = false; precedente = null;
  obiettivo = 0; agganciatoOra = false;
  if (blocco) { blocco.release().catch(() => {}); blocco = null; }
  $("avvia").textContent = "Avvia";
  $("avvia").classList.remove("acceso");
  $("spia").className = "spia";
  $("etichetta-gps").textContent = "GPS spento";
}

$("avvia").addEventListener("click", () => {
  if (DEMO) return;
  if (attivo) { fermaTutto(); return; }
  if (!navigator.geolocation) { $("messaggio").textContent = "Questo browser non espone la posizione."; return; }
  attivo = true;
  $("avvia").textContent = "Ferma";
  $("avvia").classList.add("acceso");
  $("messaggio").innerHTML = "In attesa del primo aggancio…";
  osservatore = navigator.geolocation.watchPosition(aggiorna, errore,
    {enableHighAccuracy: true, maximumAge: 0, timeout: 20000});
  if ("wakeLock" in navigator) tieniAccesoLoSchermo();
});

$("specchia").addEventListener("click", () => {
  const acceso = $("schermo").classList.toggle("specchio");
  document.body.classList.toggle("specchio", acceso);
  $("specchia").classList.toggle("acceso", acceso);
  try { localStorage.setItem("specchio", acceso ? "1" : "0"); } catch (e) {}
});

$("azzera").addEventListener("click", () => {
  metri = 0; secondiInMoto = 0; massima = 0; precedente = null;
  $("distanza").textContent = "0,0"; $("media").textContent = "0"; $("massima").textContent = "0";
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && attivo && "wakeLock" in navigator) tieniAccesoLoSchermo();
});

try {
  if (localStorage.getItem("specchio") === "1") {
    $("schermo").classList.add("specchio");
    document.body.classList.add("specchio");
    $("specchia").classList.add("acceso");
  }
} catch (e) {}

// se siamo in una cornice, il problema si conosce prima di premere Avvia
if (window.self !== window.top) {
  $("messaggio").innerHTML = "Questa pagina sta girando <b>dentro una cornice</b>: se il GPS viene " +
    "rifiutato senza nemmeno chiedertelo, il motivo &egrave; questo. Aprila sul tuo dominio.";
}

/* ?demo: la velocita' sale fino a 195 e ridiscende in 30 secondi, senza GPS, per vedere i colori
   da fermi. Non conta strada e non tocca media e massima. */
if (DEMO) {
  const inizio = performance.now();
  agganciatoOra = true;
  $("spia").className = "spia demo";
  $("etichetta-gps").textContent = "Dimostrazione";
  $("messaggio").innerHTML = "<b>Dimostrazione:</b> velocit&agrave; simulate, non &egrave; il GPS. " +
    "Togli <b>?demo</b> dall&rsquo;indirizzo per usarlo davvero.";
  setInterval(() => {
    const f = ((performance.now() - inizio) / 30000) % 1;
    obiettivo = 195 * (0.5 - 0.5 * Math.cos(f * 2 * Math.PI));
  }, 100);
}
</script>

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
